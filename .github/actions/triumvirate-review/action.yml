name: 'Triumvirate Review'
description: 'Run Triumvirate code review with optional PR comments'
inputs:
  mode:
    description: 'Execution mode: normal or strict'
    required: false
    default: 'normal'
  post_summary:
    description: 'Post a summary comment on the PR'
    required: false
    default: 'true'
  post_inline_comments:
    description: 'Post inline comments on specific lines'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub token for posting comments (defaults to GITHUB_TOKEN)'
    required: false
    default: '${{ github.token }}'
  markup_percent:
    description: 'Customer markup over provider cost for the PR review'
    required: false
    default: '40'
runs:
  using: 'composite'
  steps:
    - name: Build Triumvirate Action
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build
    - name: Review pull request
      shell: bash
      run: node "${{ github.action_path }}/scripts/github-action.js"
